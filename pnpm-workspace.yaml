# ビルドスクリプトの実行ポリシー (pnpm v11+ は allowBuilds マップを使用)
allowBuilds:
  esbuild: true
  sharp: true
  # @huggingface/transformers のローカル推論に必要
  onnxruntime-node: true
  protobufjs: true
  # re2 は url-regex-safe が try/catch で読み込み、失敗時は native RegExp に
  # フォールバックするためネイティブコンパイルは不要
  re2: false
minimumReleaseAgeExclude:
  - lucide@1.55.0
